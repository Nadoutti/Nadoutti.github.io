<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browsers cache favicons far more aggressively than other assets and
         ignore Cache-Control here; bump ?v= whenever the icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedro Nadotti — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Pedro Nadotti — software engineer. Projects, professional and academic experience, and contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pedro Nadotti — Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Pedro Nadotti — software engineer. Projects, professional and academic experience, and contact."
    />
    <meta property="og:url" content="https://nadoutti.github.io/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
